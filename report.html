
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PondGuard — Report an Issue</title>
  <script src="script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">PondGuard</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="report.html">Report</a>
        <a href="community.html">Community</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <h1>Report an Issue</h1>
    <form id="report-form" class="report-form" enctype="multipart/form-data">
      <div class="form-grid">
        <label>
          Issue Type
          <select id="issueType" name="issueType" required>
          <option value="">Choose one</option>
          <option value="Pollution">Pollution</option>
          <option value="Water Quality and Level">Water Quality and Level</option>
          <option value="Maintenance">Maintenance</option>
        </select>
      </label>
      <input id="district" name="district" type="hidden" value="Krishnagiri">
      <label>
        Pond Location
        <select id="location" name="location" required>
          <option value="">Select a Krishnagiri pond</option>
          <option value="Krishnagiri Reservoir">Krishnagiri Reservoir</option>
          <option value="Krishnagiri Dam Pond">Krishnagiri Dam Pond</option>
          <option value="Krishnagiri Lake">Krishnagiri Lake</option>
          <option value="KRP Lake">KRP Lake</option>
          <option value="Other Krishnagiri pond location">Other Krishnagiri pond location</option>
        </select>
      </label>
          <option value="Nagercoil Kodayar River">Nagercoil — Kodayar River</option>
          <option value="Nagapattinam Velankanni Beach Pond">Nagapattinam — Velankanni Pond</option>
          <option value="Kanchipuram Pallavaram Lake">Kanchipuram — Pallavaram Lake</option>
          <option value="Kanyakumari Vivekananda Rock Memorial">Kanyakumari — Coastal Pond Area</option>
          <option value="Villupuram Gingee Fort Area">Villupuram — Gingee Pond Area</option>
          <option value="Cuddalore Thiruvakkarai Lake">Cuddalore — Thiruvakkarai</option>
          <option value="Thanjavur Kallanai Dam">Thanjavur — Kallanai Dam Area</option>
          <option value="Tiruvarur Muthupet Lagoon">Tiruvarur — Muthupet Lagoon</option>
          <option value="Ariyalur Marudaiyar Pond">Ariyalur — Marudaiyar Pond</option>
          <option value="Dindigul Kodaikanal Lake">Dindigul — Kodaikanal Lake</option>
          <option value="Karur Amaravathi River Area">Karur — Amaravathi River Area</option>
          <option value="Perambalur Vellar River Area">Perambalur — Vellar River Area</option>
          <option value="Ramanathapuram Pamban Island Pond">Ramanath  apuram — Pamban Island Pond</option>
          <option value="Sivaganga Keezhadi Pond">Sivaganga — Keezhadi Pond</option>
          <option value="Tiruvannamalai Annamalaiyar Temple Pond">Tiruvannamalai — Annamalaiyar Temple Pond</option>
          <option value="Theni Suruli Falls Pond">Theni — Suruli Falls Pond</option>          <option value="Thiruvallur Pulicat Lake">Thiruvallur — Pulicat Lake</option>
        <option value="Other Tamil Nadu pond location">Other Tamil Nadu pond location</option>
        </select>
      </label>
      <label>
        Description
        <textarea id="description" name="description" required></textarea>
      </label>
      <label class="file-upload">
        Upload Photos
        <input id="images" name="images" type="file" accept="image/*" multiple>
      </label>
      <label class="file-upload">
        Upload Videos
        <input id="videos" name="videos" type="file" accept="video/*" multiple>
      </label>
      <button class="button button-primary" type="submit">Submit</button>
      <p id="formMessage" class="form-message" aria-live="polite"></p>
    </form>
    <section class="map-section">
      <h2>Pond Location Map</h2>
      <p>Select a Krishnagiri pond above to view it on Google Maps.</p>
      <div class="map-frame-wrap">
        <iframe
          id="mapFrame"
          title="Pond location map"
          src="https://www.google.com/maps?q=Krishnagiri+district+pond&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container">&copy; PondGuard</div></footer>
  <script src="script.js"></script>
</body>
</html>
